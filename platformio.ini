; PlatformIO configuration for ESP32 Smart Irrigation Controller.
;
; Two environments:
;   esp32dev — firmware build for the ESP32 DevKit V1 target.
;   native   — host-side unit tests (Unity) for pure logic such as
;              sensor calibration and the safety FSM.
;
; All pin numbers and TFT_eSPI configuration are pinned here via
; build_flags so the build is reproducible without editing files
; inside .pio/libdeps.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  ; --- TFT_eSPI configuration (avoids editing User_Setup.h) ---
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=19
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=2
  -DTFT_RST=15
  ; Only fonts 2 and 4 are referenced from src/display.cpp; the larger
  ; built-in (6, 7) and GFX (GFXFF) families ship as unreferenced
  ; .rodata that the linker still kept under the previous flags.
  ; Dropping them saves ~30 KB of flash, which is the difference
  ; between the Build 5 plan target (<80%) and where the firmware
  ; was sitting (83.8%) once Telegram + HTTPClient/TLS were added.
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  ; --- Application ---
  -DCORE_DEBUG_LEVEL=2
  -DAPP_VERSION=\"0.1.0\"
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  bblanchon/ArduinoJson@^6.21.5

[env:native]
platform = native
test_framework = unity
test_build_src = true
; main.cpp pulls in Arduino.h unconditionally; exclude it from the
; host build. Its job (orchestrating begin/tick) is not under test.
build_src_filter = +<*> -<main.cpp>
build_flags =
  -std=gnu++17
  -DUNIT_TEST
