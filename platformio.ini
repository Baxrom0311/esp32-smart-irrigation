; PlatformIO configuration for ESP32 Smart Irrigation Controller.
;
; Two environments:
;   esp32dev — firmware build for the ESP32 DevKit V1 target.
;   native   — host-side unit tests (Unity) for pure logic such as
;              sensor calibration and the safety FSM.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DAPP_VERSION=\"0.1.0\"
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  bblanchon/ArduinoJson@^6.21.5

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<*> -<main.cpp>
build_flags =
  -std=gnu++17
  -DUNIT_TEST
