[project]
path = "."
brief_file = "PROJECT_BRIEF.md"
test_command = "pio run 2>&1"
logs_dir = ".agentloop/runs"

[loop]
plan_cycles = 3
review_cycles = 3
build_iterations = 5
no_change_limit = 2
sleep_between_rounds_sec = 2
max_total_builds = 40
max_discovery_rounds = 1
parallel_review = true

[retry]
max_attempts = 3
backoff_base = 2
backoff_max = 60
jitter = true

[budget]
max_cost_usd = 8.0
warn_at_pct = 80
cost_per_build_usd = 0.15
cost_per_review_usd = 0.05
cost_per_plan_usd = 0.10

[agents.planner]
command = "kiro-cli"
agent = "ai-planner"
timeout_sec = 3600
trust_all_tools = true

[agents.builder]
command = "kiro-cli"
agent = "ai-builder"
timeout_sec = 7200
trust_all_tools = true

[agents.reviewer]
command = "kiro-cli"
agent = "ai-reviewer"
timeout_sec = 3600
trust_all_tools = true

[kiro]
enabled = true
command = "kiro-cli"
agent = "ai-planner"
timeout_sec = 3600
trust_all_tools = true

[kiro_builder]
enabled = true
command = "kiro-cli"
agent = "ai-builder"
timeout_sec = 7200
trust_all_tools = true

[telegram]
enabled = false
bot_token = ""
chat_id = ""

[git]
auto_push = false
branch = "main"
